name: CI

# 모든 PR과 main push에서 빌드를 자동 검증한다.
# 신설 근거: 2026-09-05 감사 시정지시서 C-0.
#   이 저장소에는 배포 훅 호출(deploy-main.yml)만 있고 코드 관문이 없었다. F-6 발생지다.
#
# ⚠️ **왜 typecheck·lint 가 없는가 (2026-09-05 정상무 실측)**
#   두 가지를 지금 넣으면 **모든 PR 이 영구히 빨간불**이 되어, 관문이 있으나 아무도
#   보지 않는 상태가 된다. 관문이 없는 것보다 나쁘다.
#     - `tsc --noEmit` : 기존 타입 오류 다수(kakao-map 의 window.kakao, three 타입 선언 없음,
#       OrdinaryWageCalc 의 as 캐스팅 등). 코드를 고쳐야 통과하며, 이번 시정 범위 밖이다.
#     - `npm run lint` = `next lint` : ESLint 가 설정돼 있지 않아 **대화형 프롬프트**가 뜬다.
#       비대화형 CI 에서는 그대로 실패한다.
#   → **먼저 build 만 관문으로 건다.** 배포를 깨뜨리는 변경은 여기서 잡힌다.
#      타입·린트 정리는 별도 과제로 상신하고, 정리되면 이 파일에 단계를 추가한다.
#
# ⚠️ 이 저장소는 **pnpm** 을 쓴다(pnpm-lock.yaml). npm ci 로 바꾸지 말 것.
# ⚠️ 브랜치 보호의 「필수 검사」 이름은 아래 잡 이름 `verify` 다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          # 빌드 시 페이지 데이터 수집 단계에서 클라이언트를 생성하는 모듈이 있어
          # (app/api/ai/generate-post) 값이 비면 실패한다. 무해한 자리표시자만 준다.
          # 실제 키는 Vercel 환경변수에만 둔다.
          OPENAI_API_KEY: sk-placeholder-for-ci-build-only
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
