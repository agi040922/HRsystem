name: Governance Gate

# 전결규정(제4조) 관문. 코드가 맞는가(ci.yml)와 별개로 **이걸 올려도 되는가**를 본다.
# 신설 근거: 2026-09-05 감사 시정지시서 C-1·C-2·C-3.
#   F-1 은 ci.yml 의 verify 를 통과했다 — tsc·lint·test·build 는 통과했는데
#   가-1·가-5호 사전결재가 없었다. 관문이 등급을 보지 않았기 때문이다.
#
# 판정 기준은 시정지시서 A-5 승인 정의를 그대로 쓴다(사람이 매번 해석하지 않는 것이 목적).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 변경 파일·본문 수집
        id: collect
        run: |
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
          BASE="origin/${{ github.base_ref }}"
          git diff --name-only "$BASE...HEAD" > /tmp/changed_files.txt
          git diff "$BASE...HEAD" -- '*.ts' '*.tsx' '*.md' '*.json' > /tmp/diff_body.txt || true
          echo "── 변경 파일 ──"
          cat /tmp/changed_files.txt

      # ── C-1. 마이그레이션 관문 (가-5호) — 차단 ─────────────────────────
      # supabase/migrations/ 에 파일이 추가되는 순간은 예외 없이 가-5호다.
      # 결함 수정 목적이어도 마찬가지다(A-2 추인 조건).
      - name: C-1 마이그레이션 관문 (가-5호)
        env:
          HAS_APPROVAL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'approved:가-5호') }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! grep -q '^supabase/migrations/' /tmp/changed_files.txt; then
            echo "마이그레이션 변경 없음 — 통과"
            exit 0
          fi

          echo "::group::가-5호 해당 파일"
          grep '^supabase/migrations/' /tmp/changed_files.txt
          echo "::endgroup::"

          if [ "$HAS_APPROVAL_LABEL" = "true" ]; then
            echo "결재 라벨 'approved:가-5호' 확인 — 통과"
            exit 0
          fi

          if git log --format='%B' "origin/${{ github.base_ref }}..HEAD" | grep -qE '^(결재|Approved):[[:space:]]*가-5호'; then
            echo "커밋 트레일러 '결재: 가-5호' 확인 — 통과"
            exit 0
          fi

          if printf '%s' "$PR_BODY" | grep -qE '(결재|Approved):[[:space:]]*가-5호'; then
            echo "PR 본문의 결재 표기 확인 — 통과"
            exit 0
          fi

          echo "::error title=가-5호 사전결재 없음::supabase/migrations/ 에 파일이 추가됐습니다. 목적이 결함 수정이어도 전결규정 제4조 가-5호입니다."
          echo ""
          echo "해제 방법 (셋 중 하나)"
          echo "  1) PR 에 라벨 'approved:가-5호' 부여"
          echo "  2) 커밋 메시지에 트레일러 한 줄:  결재: 가-5호"
          echo "  3) PR 본문에 '결재: 가-5호' 기재"
          echo ""
          echo "근거: 2026-09-05 감사 F-1 (8896dd6 — verify 는 통과했으나 사전결재가 없었다)"
          exit 1

      # ── C-2. 법률 문구 관문 (가-3·가-6호) — 경고 ───────────────────────
      # F-2·F-6 은 둘 다 분량이 작아서 등급 판정을 건너뛴 사례다.
      # 카드 하나, 뉴스레터 한 편이었다. 차단하지 않고 눈에 띄게만 한다.
      - name: C-2 법률 문구 관문 (가-3·가-6호)
        run: |
          PATTERN='판례|법원은|대법원|행정해석|징계사유|제[0-9]+조'
          if grep -nE "^\+" /tmp/diff_body.txt | grep -vE '^\+\+\+' | grep -qE "$PATTERN"; then
            echo "::warning title=법률 문구 포함 — 가-3·가-6호 확인 필요::추가된 줄에 판례·법령 조문·징계 관련 표현이 있습니다. 노무사 검수를 거쳤는지 확인하세요."
            echo "── 해당 줄 (최대 20개) ──"
            grep -nE "^\+" /tmp/diff_body.txt | grep -vE '^\+\+\+' | grep -E "$PATTERN" | head -20
          else
            echo "법률 문구 없음 — 통과"
          fi

      # ── C-3. 미결 주제 선반영 관문 — 경고 ──────────────────────────────
      # ⚠️ 한계: 판정 기준인 `company\결재대기.md` 는 **git 저장소 밖**에 있어
      #    CI 가 직접 읽을 수 없다. 그래서 키워드를 이 저장소에 복사해 둔다
      #    (`.github/pending-topics.txt`). 원본이 바뀌면 **정상무가 갱신해야 하며,
      #    갱신을 놓치면 이 관문은 조용히 옛 목록으로 돈다.** 이 한계를 감사에 보고했다.
      - name: C-3 미결 주제 선반영 관문
        run: |
          LIST=.github/pending-topics.txt
          if [ ! -f "$LIST" ]; then
            echo "::warning title=미결 주제 목록 없음::$LIST 가 없어 C-3 관문이 동작하지 않습니다."
            exit 0
          fi

          AGE_DAYS=$(( ( $(date +%s) - $(git log -1 --format=%ct -- "$LIST") ) / 86400 ))
          if [ "$AGE_DAYS" -gt 30 ]; then
            echo "::warning title=미결 주제 목록이 오래됐습니다::$LIST 가 ${AGE_DAYS}일 전 기준입니다. company\\결재대기.md 와 대조해 갱신하세요."
          fi

          HIT=0
          while IFS= read -r kw; do
            case "$kw" in ''|'#'*) continue ;; esac
            if git log --format='%B' "origin/${{ github.base_ref }}..HEAD" | grep -qiF "$kw" \
               || grep -qiF "$kw" /tmp/diff_body.txt; then
              echo "::warning title=미결 주제 선반영 의심::결재대기 항목 「${kw}」 이(가) 이 PR 에 등장합니다. CEO 판단 전 선반영이 아닌지 확인하세요."
              HIT=1
            fi
          done < "$LIST"
          [ "$HIT" = "0" ] && echo "미결 주제 등장 없음 — 통과"
          exit 0
